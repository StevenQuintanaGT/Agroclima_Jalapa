name: agroclima_jalapa
description: "Monitoreo meteorológico y alertas de riesgo climático para productores de Jalapa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0
  provider: ^6.1.5+1
  go_router: ^18.0.1
  geolocator: ^14.1.0
  permission_handler: ^13.0.2
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0

flutter:

  uses-material-design: true

  assets:
    - assets/geo/
    - assets/img/

